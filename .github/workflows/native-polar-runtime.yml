name: Native polar runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact owned compiler head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true
      - name: Install compiler bootstrap dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev
      - name: Build ICK and its native target runtimes
        run: make -f qualification/native-polar/Makefile build
      - name: Execute dialect and complex regressions at O0, O2, and O3
        run: make -f qualification/native-polar/Makefile check
      - name: Retain the exact native compiler and target runtimes for consumer replay
        run: |
          git rev-parse HEAD > build/native-polar/source.txt
          sha256sum build/native-polar/stage/bin/gcc \
            build/native-polar/stage/libexec/gcc/x86_64-pc-linux-gnu/17.0.0/cc1 \
            > build/native-polar/compiler.sha256
          tar -C build/native-polar/stage -czf build/native-polar/native-stage.tar.gz .
          sha256sum build/native-polar/native-stage.tar.gz > build/native-polar/native-stage.sha256
      - name: Split the unchanged archive for bounded consumer downloads
        shell: sh
        run: |
          test "$(stat -c %s build/native-polar/native-stage.tar.gz)" -le 943718400
          split --number=2 --numeric-suffixes=0 --suffix-length=2 \
            build/native-polar/native-stage.tar.gz build/native-polar/native-stage.part-
          test -s build/native-polar/native-stage.part-00
          test -s build/native-polar/native-stage.part-01
          sha256sum build/native-polar/native-stage.part-00 \
            build/native-polar/native-stage.part-01 > build/native-polar/native-stage.parts.sha256
          cat build/native-polar/native-stage.part-00 \
            build/native-polar/native-stage.part-01 > build/native-polar/native-stage.reassembled.tar.gz
          cmp build/native-polar/native-stage.tar.gz build/native-polar/native-stage.reassembled.tar.gz
          rm build/native-polar/native-stage.reassembled.tar.gz
      - name: Deliver the first unchanged archive part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-polar-runtime-part-00
          path: |
            build/native-polar/native-stage.part-00
            build/native-polar/native-stage.parts.sha256
            build/native-polar/native-stage.sha256
            build/native-polar/compiler.sha256
            build/native-polar/source.txt
            build/native-polar/scalar-runtime-packages.tsv
            build/native-polar/ick-runtime.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Deliver the second unchanged archive part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-polar-runtime-part-01
          path: |
            build/native-polar/native-stage.part-01
            build/native-polar/native-stage.parts.sha256
            build/native-polar/native-stage.sha256
            build/native-polar/compiler.sha256
            build/native-polar/source.txt
            build/native-polar/scalar-runtime-packages.tsv
            build/native-polar/ick-runtime.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Preserve runtime dependency receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-polar-runtime-receipts
          path: |
            build/native-polar/scalar-runtime-packages.tsv
            build/native-polar/ick-runtime.sha256
            build/native-polar/source.txt
            build/native-polar/compiler.sha256
            build/native-polar/native-stage.sha256
            build/native-polar/native-stage.tar.gz
      - name: Execute bigmul correctness and refusal controls with staged native ICK
        run: make -f qualification/native-polar/Makefile check-bigmul
      - name: Check out the pinned benchmark Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .benchmark-tools/ithon
          persist-credentials: false
      - name: Measure hot multiplication with staged native ICK
        id: ick-bigmul-timing
        env:
          CC: ${{ github.workspace }}/build/native-polar/stage/bin/gcc
          ITHON_PYTHON: /usr/bin/python3
          ITHON_CHECK_RECEIPT: ${{ github.workspace }}/build/native-polar/bigmul/ithon.jsonl
        run: |
          receipt_dir=build/native-polar/bigmul
          ithon=.benchmark-tools/ithon/ithon
          mkdir -p "$receipt_dir"
          cp build/native-polar/source.txt build/native-polar/compiler.sha256 \
            build/native-polar/ick-runtime.sha256 "$receipt_dir/"
          sha256sum "$(realpath "$("$CC" -print-file-name=libgmp.so)")" > "$receipt_dir/gmp-library.sha256"
          "$ithon" .benchmark-tools/ithon/tests/qualify-host-control.pi \
            "$receipt_dir/ithon-qualification.json"
          "$ithon" benchmarks/bigmul/modes/hot/check_mb07.pi --require-gmp \
            --output "$receipt_dir/mb07.json" > /dev/null
          "$ithon" benchmarks/bigmul/analysis/check_mb12.pi --input "$receipt_dir/mb07.json" \
            --output "$receipt_dir/mb12.json" > /dev/null
      - name: Retain raw native ICK timing and paired analysis
        if: ${{ !cancelled() && (steps.ick-bigmul-timing.outcome == 'success' || steps.ick-bigmul-timing.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bigmul-native-ick-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-polar/bigmul/
          if-no-files-found: error
          retention-days: 30
